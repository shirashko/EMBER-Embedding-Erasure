# CRISP (Qwen-Scope SAE + LoRA unlearning) on Qwen3.5-2B (no EMBER step).
#
# Residual SAEs: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_50 (Top-K 50, 24 layers).
# Unlearning runs on the Instruct checkpoint; SAEs are trained on Base.
#
# Usage:
#   python -m ember.run_erasure --config configs/crisp_qwen.yaml \
#       --train-eval mc --concepts "Golf" --skip-llm-judge

method: crisp
model_name: Qwen/Qwen3.5-2B
rank: 100
seed: 42
topk: 15
run_tests_after_train: true

selection:
  ratio_thresh: 2.0

ember_step:
  enabled: false

crisp:
  k_features_grid: [5, 10, 20]
  alpha_grid: [5.0, 10.0, 20.0, 50.0]
  lr_grid: [5.0e-5, 1.0e-4, 5.0e-4]
  batch_size: 16
  num_epochs: 2
  lora_batch_size: 16
  beta: 0.99
  gamma: 0.01
  lora_rank: 4
  sae_cache: qwen_sae_cache
  max_len: 2000

eval:
  alpaca: false
  min_mmlu: 0.7
  max_qa_acc: 0.6

relearning:
  enabled: true
  max_paragraphs: 100
  csv_path: data/relearn_paragraphs.json

checkpoint:
  enabled: true
  root: unlearned_checkpoints
