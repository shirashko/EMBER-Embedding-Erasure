# SNMF MLP erasure on Qwen3.5-2B (no EMBER embedding step).
#
# 144-cell grid: 4 in_deltas × 3 in-ranges × 4 out_deltas × 3 out-ranges.
# Layer bands are Qwen3.5 24-layer defaults in ember/erasure/methods/snmf.py.
# Requires local MLP features + interpretations under
#   mf_outputs/Qwen_Qwen3.5-2B/.../mlp/potential_features.csv
#
# Usage:
#   python -m ember.run_erasure --config configs/snmf_qwen.yaml \
#       --train-eval mc --concepts "Golf" --features-source local --skip-llm-judge

method: snmf
model_name: Qwen/Qwen3.5-2B
rank: 100
seed: 42
topk: 15
run_tests_after_train: true
features_source: local

selection:
  ratio_thresh: 2.0
  coverage_thresh: 0.95

ember_step:
  enabled: false

snmf:
  w_mode: both
  feature_source: all
  in_deltas: [1.0, 4.0, 7.0, 10.0]
  out_deltas: [1.0, 4.0, 7.0, 10.0]
  dtype: bf16

eval:
  alpaca: false
  min_mmlu: 0.7
  max_qa_acc: 0.6

relearning:
  enabled: true
  max_paragraphs: 100
  csv_path: data/relearn_paragraphs.json

checkpoint:
  enabled: true
  root: unlearned_checkpoints
