# Note: this specific config is not taken from Clara findings, but rather from my manual grid search run.

# Reproduce optimal unlearning: Llama / PISCES / Republic of Ireland
#
# Grid winner from seed-42 train_open (top_hps_valid harmonic): k=0.6, value=13.0.
# Test open: spec=0.996, eff=0.905, harmonic=0.948.
#
# Usage:
#   python -m ember.run_erasure --config configs/reproduce_optimal_configs/pisces/llama/republic_of_ireland.yaml \
#       --concepts "Republic of Ireland" --train-eval open \
#       --features-source local

method: pisces
model_name: meta-llama/Llama-3.1-8B-Instruct
rank: 200
seed: 42
topk: 1
run_tests_after_train: true
features_source: local
selection:
  ratio_thresh: 2.0
ember_step:
  enabled: false
pisces:
  ks:
  - 0.6
  values:
  - 13.0
  dtype: bf16
eval:
  alpaca: false
  min_mmlu: 0.7
  max_qa_acc: 0.6
  alpaca_batch_size: 75
relearning:
  enabled: true
  max_paragraphs: 100
  csv_path: data/relearn_paragraphs.json
checkpoint:
  enabled: true
  root: unlearned_checkpoints
