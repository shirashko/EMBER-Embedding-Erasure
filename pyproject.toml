[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-erasure"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "transformers>=5.2.0",
    "transformer-lens>=3.5.0",
    "numpy==1.26.4",
    "pandas==2.3.1",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "matplotlib==3.10.5",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "einops==0.8.1",
    "huggingface-hub>=1.5.0",
    "accelerate==1.9.0",
    "safetensors>=0.8.0",
    "sentencepiece==0.2.0",
    "protobuf==5.29.5",
    "datasets==4.4.0",
    "peft==0.18.0",
    "sae-lens==6.20.1",
    "bitsandbytes==0.49.2",
    "dataclasses-json==0.6.7",
    "natsort==8.4.0",
    "google-genai>=1.0.0",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = [".", "external/snmf"]
namespaces = true
include = ["ember*", "factorization*", "llm_utils*", "data_utils*"]
